apiVersion: apps/v1
kind: Deployment

metadata:
  name: excel-mapper

spec:
  replicas: 1

  selector:
    matchLabels:
      app: excel-mapper

  template:
    metadata:
      labels:
        app: excel-mapper

    spec:
      containers:
        - name: excel-mapper
          image: excel-mapper:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:password@postgres-service:5432/excel_mapper"

